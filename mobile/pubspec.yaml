name: mezan
description: Expense tracker for Egypt/MENA - manual + SMS, categories, budgets.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  fl_chart: ^0.66.2
  permission_handler: ^11.3.0
  telephony: ^0.2.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  record: ^5.0.4

dependency_overrides:
  # record_linux 0.7.2 does not implement startStream/hasPermission(request); 1.3.0 does (fixes iOS build).
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
